<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <title>Contact — Sharab Shrestha</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html">Sharab<span>.</span></a>
      <nav>
        <a href="projects.html">Projects</a><a href="about.html">About</a
        ><a href="contact.html">Contact</a>
      </nav>
      <a class="header-mail" href="mailto:sharabshrestha@proton.me"
        >Email me ↗</a
      >
    </header>
    <main>
      <section class="intro page-intro">
        <p class="kicker">Get in touch</p>
        <h1>Say<br /><span>hello.</span></h1>
        <p class="intro-copy">
          This form opens your own email app. Your message is not stored by this
          website.
        </p>
      </section>
      <section class="contact section">
        <div class="section-label">
          <span>01</span>
          <h2>Message</h2>
        </div>
        <form class="contact-form" id="contact-form">
          <label for="name">Name</label
          ><input
            id="name"
            name="name"
            required
            maxlength="80"
            autocomplete="name"
          /><label for="email">Email</label
          ><input
            id="email"
            name="email"
            type="email"
            required
            maxlength="160"
            autocomplete="email"
          /><label for="message">Message</label
          ><textarea
            id="message"
            name="message"
            required
            maxlength="2000"
            rows="7"
          ></textarea
          ><button class="button" type="submit">Open email draft ↗</button>
          <p class="form-note" id="form-note" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <footer>
      <span>© 2026 Sharab Shrestha</span><span>sharabshrestha@proton.me</span
      ><a href="index.html">Home ↑</a>
    </footer>
    <script src="contact.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Contact Sharab Shrestha using a simple email draft form that opens the visitor's mail app."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sarabshrestha.com.np/contact.html" />
    <meta property="og:title" content="Contact — Sharab Shrestha" />
    <meta
      property="og:description"
      content="Send a message to Sharab Shrestha using the contact form on the website."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sarabshrestha.com.np/contact.html" />
    <meta
      property="og:image"
      content="https://sarabshrestha.com.np/assets/og-image.svg"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <title>Contact — Sharab Shrestha</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html">Sharab<span>.</span></a>
      <button
        class="nav-toggle"
        type="button"
        aria-controls="site-nav"
        aria-expanded="false"
        aria-label="Open navigation menu"
      >
        Menu
      </button>
      <nav id="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="about.html">About</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
      <a class="header-mail" href="mailto:sharabshrestha@proton.me"
        >Email me ↗</a
      >
    </header>
    <main>
      <section class="intro page-intro">
        <p class="kicker">Get in touch</p>
        <h1>Say<br /><span>hello.</span></h1>
        <p class="intro-copy">
          This form opens your own email app to send a draft. Your message is
          not stored by this website. If no app opens, email
          sharabshrestha@proton.me directly.
        </p>
      </section>
      <section class="contact section">
        <div class="section-label">
          <span>01</span>
          <h2>Message</h2>
        </div>
        <form class="contact-form" id="contact-form">
          <label for="name">Name</label
          ><input
            id="name"
            name="name"
            required
            maxlength="80"
            autocomplete="name"
          /><label for="email">Email</label
          ><input
            id="email"
            name="email"
            type="email"
            required
            maxlength="160"
            autocomplete="email"
          /><label for="message">Message</label
          ><textarea
            id="message"
            name="message"
            required
            maxlength="2000"
            rows="7"
          ></textarea
          ><button class="button" type="submit">Open email draft ↗</button>
          <p class="form-note" id="form-note" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <footer>
      <span>© 2026 Sharab Shrestha</span><span>sharabshrestha@proton.me</span
      ><a href="index.html">Home ↑</a>
    </footer>
    <script src="script.js"></script>
    <script src="contact.js"></script>
  </body>
</html>
